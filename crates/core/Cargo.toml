[package]
name = "music-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
lofty = "=0.25.4"
unicode-normalization = "0.1.25"
flate2 = "1.1.10"
base64 = "0.23.1"
qrcode = { version = "0.14.1", default-features = false }
rqrr = { version = "0.11.0", default-features = false }
# WebP and GIF: read for cover thumbnails (YouTube's vi_webp frames, Apple and Google art), never written.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# LRCLIB's Lyricsfile (YAML, word timings): reading only, panic-free, with limits for untrusted input.
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
sha2 = "0.11.1"
rand = "0.10.3"
ts-rs.workspace = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt"] }
tempfile = "3.27.0"
