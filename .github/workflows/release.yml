name: release

# Every push to master that passes `check` is released as a BETA: signed Windows installer + latest.json, then the signed
# Android APK (last step), on a GitHub prerelease. Version = MAJOR.MINOR from tauri.conf.json + patch = commits on master
# (scripts/release.mjs): 1.1.0 in the file, 1.1.<commits> released. "[skip release]" in the commit's first line: no
# release for that push. Run by hand: Actions › release › Run workflow.
# Two channels (Settings › General › Updates), two files (src-tauri/src/update.rs):
# - Beta reads releases/download/beta/latest.json: the rolling `beta` release, whose latest.json is copied here from
#   each new release (last step).
# - Stable reads releases/latest/download/latest.json (src-tauri/tauri.conf.json › plugins.updater, the URL every installed
#   version has always read). GitHub's "latest" skips prereleases, so it moves only when the `promote` workflow turns a
#   beta into a normal release. Nothing here may touch it.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One at a time, in push order (a newer push replaces one still waiting).
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # First line only: a body that explains the switch (2026-10-17's did) mustn't trip it.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.subject.outputs.go }}
    steps:
      - id: subject
        env:
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          if [[ "$subject" == *"[skip release]"* ]]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    # Windows installer, then the APK.
    timeout-minutes: 90
    env:
      # The commit `check` passed on (not master's tip if another push landed since).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          # Patch number = commit count, notes = commits since the last tag: full history and tags.
          fetch-depth: 0

      # Signing key: repository secret (the private key never goes in the repo). Without it no updater artifacts.
      - name: Check the signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing: see CONTRIBUTING.md › Releasing"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The APK's (last step).
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Version and notes
        id: release
        run: node scripts/release.mjs

      # Third-party notices bundled in the installer (docs/licenses.md), from this commit's Cargo.lock and
      # pnpm-lock.yaml. The release build stops if they're missing.
      # Same lockfiles as a past release: its notices again (2 min saved), only the version line changes.
      - id: notices
        uses: actions/cache@v4
        with:
          path: src-tauri/third-party-licenses.html
          key: notices-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'about.toml', 'scripts/notices.mjs') }}

      - if: steps.notices.outputs.cache-hit == 'true'
        shell: bash
        run: sed -i -E "s/Legato [0-9]+\.[0-9]+\.[0-9]+/Legato ${{ steps.release.outputs.version }}/g" src-tauri/third-party-licenses.html

      - if: steps.notices.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - if: steps.notices.outputs.cache-hit != 'true'
        run: pnpm notices

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.release.outputs.version }}
          releaseName: Legato v${{ steps.release.outputs.version }}
          releaseCommitish: ${{ env.SHA }}
          releaseBody: ${{ steps.release.outputs.notes }}
          releaseDraft: false
          # Beta only: a prerelease is never GitHub's "latest", so Stable's latest.json stays where it is.
          prerelease: true
          updaterJsonPreferNsis: true

      # Beta's file: the release called `beta` (made once, a prerelease, never "latest") carries only this latest.json,
      # replaced at every release; its installer link points at the release above.
      - name: Point Beta at this release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/beta"
          mkdir -p "$dir"
          gh release download "v$VERSION" --pattern latest.json --dir "$dir" --clobber
          if ! gh release view beta > /dev/null 2>&1; then
            gh release create beta --prerelease --latest=false --target "$SHA" --title "Legato Beta" \
              --notes "Only latest.json, which the app's Beta channel reads. Moves with every release; the installers are on the versioned releases."
          fi
          gh release upload beta "$dir/latest.json" --clobber

      # Android: the signed APK, one more file on the versioned release. After the Beta pointer, so a failure here never
      # holds the Windows Beta back. Keystore: repository secrets ANDROID_KEYSTORE (the .jks in base64) and
      # ANDROID_KEYSTORE_PASSWORD (store and key), alias `legato`. SDK and NDK: the runner's own.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The APK's own notices (next step): installed again when the Windows ones came from the cache.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Android APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secrets ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD are missing: no APK"
            exit 1
          fi
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_HOME" ]; then
            echo "::error::No Android NDK on this runner"
            exit 1
          fi
          # Java's properties read a backslash as an escape: forward slashes.
          tmp="${RUNNER_TEMP//\\//}"
          printf '%s' "$KEYSTORE" | base64 -d > "$tmp/legato-release.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=legato\n' "$tmp/legato-release.jks" "$KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties
          # Android's crates (rustls, ring, Mozilla's roots) instead of Windows': the installer above already has its own.
          node scripts/notices.mjs aarch64-linux-android
          pnpm tauri android build --target aarch64 --apk
          apk="$tmp/Legato_${VERSION}_android-arm64.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          gh release upload "v$VERSION" "$apk" --clobber
