name: check

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # Windows = the app's platform: everything. macOS: everything too (the app shell's non-Windows build). Linux: the
  # Rust crates only (clippy + tests): the shell would need WebKitGTK, ~100 MB from Ubuntu mirrors that crawl some days
  # (review 2026-10-23: 10+ min, then a timeout), and macOS already builds it.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Crates only: ALSA headers for the player (OpenSSL and pkg-config come with the runner). A slow Ubuntu mirror
      # used to hang `apt-get update` for 20+ minutes: short timeouts, retries, a cap on the step.
      - if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do sudo apt-get $APT update && break; sleep 5; done
          sudo apt-get $APT install -y --no-install-recommends pkg-config libssl-dev libasound2-dev

      # No "packageManager" in package.json, so pin the major here (drop `version` if one is added).
      - if: runner.os != 'Linux'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - if: runner.os != 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - if: runner.os != 'Linux'
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the frontend build output (dist/) to exist.
      - if: runner.os != 'Linux'
        run: pnpm vite build

      - run: cargo fetch --locked

      # No test may reach the network: anything but loopback goes to a dead proxy (mockito servers are on 127.0.0.1).
      - if: runner.os != 'Linux'
        run: pnpm check
        env:
          CARGO_NET_OFFLINE: true
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost

      # pnpm check began by writing the interface's types from the Rust ones (scripts/types.mjs): they must be what is
      # committed. Intent-to-add, so a new type's file counts too. Windows only: Linux leaves out the app crate, which
      # holds some of the types.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          git add --intent-to-add ui/src/shared/generated
          git diff --exit-code ui/src/shared/generated || { echo '::error::Generated types are stale: run pnpm types and commit ui/src/shared/generated'; exit 1; }

      - if: runner.os == 'Linux'
        run: |
          cargo clippy --workspace --exclude legato --all-targets -- -D warnings
          cargo test --workspace --exclude legato
        env:
          CARGO_NET_OFFLINE: true
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost

  # The built app, driven like a new user (e2e/smoke.mjs, docs/development.md): welcome, a demo folder, a song that plays,
  # search against a loopback mock, quit. Windows only: it is WebView2's page that is driven. A debug build with the `e2e`
  # cargo feature (its own identifier, no network, no sound card needed: the engine drains a silent output). The build
  # and the walk are two steps: the walk is the one held to 5 minutes. A failure leaves screenshots and a report.
  # Not blocking yet: first green run 2026-10-31, and a failure only this runner has (no WebView2 runtime, another layout, a
  # slow cold start) must not turn `check` red, which holds back every beta (release.yml waits for `check` to succeed). A
  # failure shows as a warning on the run, with the screenshots. Delete `continue-on-error` after a few green runs.
  e2e:
    name: e2e (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # A failed walk is no reason to throw the build away.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # Not provisioned by the image, only found on it: say which one runs, or that none does.
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = ('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\' + $id), ('HKCU:\Software\Microsoft\EdgeUpdate\Clients\' + $id) | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          if (-not $v) { throw 'No WebView2 runtime on this runner: the app has no window to open' }
          "WebView2 runtime $v"

      # No debug info: a smaller build and a faster link, nothing here needs a debugger.
      - run: pnpm e2e --build-only
        env:
          CARGO_PROFILE_DEV_DEBUG: 0

      - name: walk
        timeout-minutes: 5
        run: pnpm e2e --skip-build

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: target/e2e/shots
          if-no-files-found: ignore

      - if: failure()
        shell: bash
        run: echo '::warning title=e2e failed::The smoke test failed. It does not block yet (continue-on-error); the e2e-failure artifact and this job log say why.'

  # Third-party licenses (docs/licenses.md): interface packages, then every Rust crate on every platform.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/licenses.mjs

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
