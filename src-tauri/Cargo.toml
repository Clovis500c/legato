[package]
name = "legato"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "legato_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The smoke test's build (`pnpm e2e`, e2e/smoke.mjs), off in every other: network calls to a loopback mock (hosts.rs),
# no audio device (crates/player output.rs).
e2e = ["music-player/null-output"]

[dependencies]
anyhow = "1.0.104"
# Already in the build (mdns-sd's): the phone remote's address when the default route has none.
if-addrs = "0.15.0"
keyring = "4.2.0"
music-connectors = { version = "1.1.0", path = "../crates/connectors" }
music-core = { version = "1.1.0", path = "../crates/core" }
music-dsp = { version = "1.1.0", path = "../crates/dsp" }
music-player = { version = "1.1.0", path = "../crates/player" }
music-shield = { version = "1.1.0", path = "../crates/shield" }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# unstable: child webviews (YouTube watch page over the video slot, ytwatch.rs).
tauri = { version = "2.12.4", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "=2.8.4"
tokio = { version = "1.53.3", features = ["time", "macros", "rt", "sync"] }
notify = "8"
ts-rs.workspace = true
url = "2.5.8"

# Desktop only: a phone has no tray, global keys, second instance or window to restore; its APK updates elsewhere.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Default features left out: their rustls (+ ring) went unused, reqwest picks Windows' TLS (native-tls) for every
# client once our crates turn it on, the updater's too.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Third-party plugins: QuickJS, whose rquickjs ships no Android bindings (its bindgen feature needs libclang).
music-plugins = { version = "1.1.0", path = "../crates/plugins" }

# The phone's name in your devices' list: Android's system properties.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2.190"
# Android's Keystore seals the secrets file (src/mobile/keystore.rs).
jni = "0.21"
ndk-context = "0.1"

# QR scanner for pairing (phones only; MIT / Apache-2.0).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["UI_ViewManagement", "Media", "Media_Control", "Foundation_Collections", "Media_SpeechRecognition", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Media_Audio", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Credentials", "Win32_System_Power", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-core = "0.62.2"
windows-registry = "0.6.1"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
mockito = "1.7.2"
