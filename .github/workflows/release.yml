name: release

# Tag vX.Y.Z (same version in package.json, Cargo.toml and tauri.conf.json): signed Windows installer and
# latest.json on a GitHub release. The app's updater reads latest.json (src-tauri/tauri.conf.json › plugins.updater).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Third-party notices bundled in the installer (docs/licenses.md), from this commit's Cargo.lock and
      # pnpm-lock.yaml. The release build stops if they're missing.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - run: pnpm notices

      # Signing key: repository secrets (the private key never goes in the repo).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Music App ${{ github.ref_name }}
          releaseBody: What changed since the last release is in the commits.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
