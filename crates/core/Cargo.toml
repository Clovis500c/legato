[package]
name = "music-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
lofty = "=0.25.4"
unicode-normalization = "0.1.25"
flate2 = "1.1.10"
base64 = "0.23.1"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt"] }
tempfile = "3.27.0"
