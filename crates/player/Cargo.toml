[package]
name = "music-player"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The smoke test's build (src-tauri `e2e`): no audio device, a thread drains the mixer at the pace of a real one (output.rs).
null-output = []

[dependencies]
anyhow = "1.0.104"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
music-dsp = { version = "1.1.0", path = "../dsp" }
ts-rs.workspace = true
