name: release

# Every push to master that passes `check` is released: signed Windows installer + latest.json on a GitHub release,
# which the app's updater reads (src-tauri/tauri.conf.json › plugins.updater). Version = MAJOR.MINOR from
# tauri.conf.json + patch = commits on master (scripts/release.mjs): 1.0.0 in the file, 1.0.<commits> released.
# "[skip release]" in the commit's first line: no release for that push. Run by hand: Actions › release › Run workflow.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One at a time, in push order (a newer push replaces one still waiting).
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # First line only: a body that explains the switch (2026-10-17's did) mustn't trip it.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.subject.outputs.go }}
    steps:
      - id: subject
        env:
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          if [[ "$subject" == *"[skip release]"* ]]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The commit `check` passed on (not master's tip if another push landed since).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          # Patch number = commit count, notes = commits since the last tag: full history and tags.
          fetch-depth: 0

      # Signing key: repository secret (the private key never goes in the repo). Without it no updater artifacts.
      - name: Check the signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing: see CONTRIBUTING.md › Releasing"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Version and notes
        id: release
        run: node scripts/release.mjs

      # Third-party notices bundled in the installer (docs/licenses.md), from this commit's Cargo.lock and
      # pnpm-lock.yaml. The release build stops if they're missing.
      # Same lockfiles as a past release: its notices again (2 min saved), only the version line changes.
      - id: notices
        uses: actions/cache@v4
        with:
          path: src-tauri/third-party-licenses.html
          key: notices-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'about.toml', 'scripts/notices.mjs') }}

      - if: steps.notices.outputs.cache-hit == 'true'
        shell: bash
        run: sed -i -E "s/Legato [0-9]+\.[0-9]+\.[0-9]+/Legato ${{ steps.release.outputs.version }}/g" src-tauri/third-party-licenses.html

      - if: steps.notices.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - if: steps.notices.outputs.cache-hit != 'true'
        run: pnpm notices

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.release.outputs.version }}
          releaseName: Legato v${{ steps.release.outputs.version }}
          releaseCommitish: ${{ env.SHA }}
          releaseBody: ${{ steps.release.outputs.notes }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
