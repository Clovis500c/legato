[package]
name = "music-app"
version.workspace = true
edition.workspace = true

[lib]
name = "music_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
keyring = "4.2.0"
music-connectors = { version = "0.1.0", path = "../crates/connectors" }
music-core = { version = "0.1.0", path = "../crates/core" }
music-player = { version = "0.1.0", path = "../crates/player" }
music-shield = { version = "0.1.0", path = "../crates/shield" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "=2.8.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
