[package]
name = "music-shield"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# No "single-thread": engine must be Sync (checked from WebView2 handler).
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
anyhow = "1.0.104"

# Android has no OpenSSL to link: rustls with ring and Mozilla's roots there (`tls()`), the system's TLS elsewhere.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3.27.0"
