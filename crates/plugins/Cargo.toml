[package]
name = "music-plugins"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["net"] }
ts-rs.workspace = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt", "net"] }
mockito = "1.7.2"
