# cargo-deny: licenses, bans, sources. CI runs `cargo deny check licenses bans sources`. Why each license is fine:
# docs/licenses.md. A new license here needs a line there first.

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft: fine unmodified (symphonia, adblock-rust). Changing their files = publish those files.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Own crates (publish = false): covered by LICENSE.
[licenses.private]
ignore = true

[bans]
# Tauri's tree has many duplicate versions: not a license question.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
