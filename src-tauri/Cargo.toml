[package]
name = "music-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "music_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
keyring = "4.2.0"
music-connectors = { version = "0.1.0", path = "../crates/connectors" }
music-core = { version = "0.1.0", path = "../crates/core" }
music-player = { version = "0.1.0", path = "../crates/player" }
music-plugins = { version = "0.1.0", path = "../crates/plugins" }
music-shield = { version = "0.1.0", path = "../crates/shield" }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# unstable: child webviews (YouTube watch page over the video slot, ytwatch.rs).
tauri = { version = "2.12.4", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-updater = "2"
tokio = { version = "1.53.3", features = ["time", "macros"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["UI_ViewManagement", "Media", "Media_SpeechRecognition", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
windows-registry = "0.6.1"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
