[package]
name = "music-app"
version.workspace = true
edition.workspace = true

[lib]
name = "music_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
keyring = "4.2.0"
music-connectors = { version = "0.1.0", path = "../crates/connectors" }
music-core = { version = "0.1.0", path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.7.2"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
