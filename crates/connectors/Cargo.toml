[package]
name = "music-connectors"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
mdns-sd = "0.21.5"
music-core = { version = "0.1.0", path = "../core" }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
spake2 = "0.4"
tokio = { version = "1.53.3", features = ["net", "io-util", "time", "macros", "rt", "sync"] }
url = "2.5.8"

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
