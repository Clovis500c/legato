name: release

# Every push to master that passes `check` is released: signed Windows installer + latest.json on a GitHub release,
# which the app's updater reads (src-tauri/tauri.conf.json › plugins.updater). Version = MAJOR.MINOR from
# tauri.conf.json + patch = commits on master (scripts/release.mjs): 0.1.0 in the file, 0.1.109 released.
# "[skip release]" in the commit message: no release for that push. Run by hand: Actions › release › Run workflow.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One at a time, in push order (a newer push replaces one still waiting).
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The commit `check` passed on (not master's tip if another push landed since).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          # Patch number = commit count, notes = commits since the last tag: full history and tags.
          fetch-depth: 0

      # Signing key: repository secret (the private key never goes in the repo). Without it no updater artifacts.
      - name: Check the signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing: see CONTRIBUTING.md › Releasing"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Version and notes
        id: release
        run: node scripts/release.mjs

      # Third-party notices bundled in the installer (docs/licenses.md), from this commit's Cargo.lock and
      # pnpm-lock.yaml. The release build stops if they're missing.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - run: pnpm notices

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.release.outputs.version }}
          releaseName: Music App v${{ steps.release.outputs.version }}
          releaseCommitish: ${{ env.SHA }}
          releaseBody: ${{ steps.release.outputs.notes }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
